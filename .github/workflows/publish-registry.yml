name: Publish Registry

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Build skills
        run: pnpm --filter @openmotoko/skills build

      - name: Package and generate checksums
        run: |
          mkdir -p dist/skills
          for dir in packages/skills/src/*/; do
            if [ -f "$dir/manifest.json" ]; then
              name=$(basename "$dir")
              tar -czf "dist/skills/${name}.tar.gz" -C packages/skills/src "$name"
              sha256sum "dist/skills/${name}.tar.gz" >> dist/skills/checksums.txt
            fi
          done

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for archive in dist/skills/*.tar.gz; do
            [ -f "$archive" ] && gh release upload "${{ github.event.release.tag_name }}" "$archive"
          done
          if [ -f dist/skills/checksums.txt ]; then
            gh release upload "${{ github.event.release.tag_name }}" dist/skills/checksums.txt
          fi
