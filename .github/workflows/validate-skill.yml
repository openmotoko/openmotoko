name: Validate Skill

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - name: Validate manifest schema
        run: |
          for dir in skills/*/; do
            if [ -f "$dir/manifest.json" ]; then
              node -e "
                const fs = require('fs');
                const raw = fs.readFileSync('${dir}manifest.json', 'utf-8');
                const manifest = JSON.parse(raw);
                const required = ['id', 'name', 'version', 'description', 'author'];
                for (const key of required) {
                  if (!manifest[key]) {
                    console.error('Missing field: ' + key + ' in ${dir}manifest.json');
                    process.exit(1);
                  }
                }
                console.log('Valid: ${dir}manifest.json');
              "
            fi
          done

      - name: Build skills
        run: |
          for dir in skills/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Building $dir"
              cd "$dir"
              pnpm install --frozen-lockfile
              pnpm build || true
              cd -
            fi
          done

      - name: Run skill tests
        run: |
          for dir in skills/*/; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir"
              if grep -q '"test"' package.json; then
                echo "Testing $dir"
                pnpm test
              fi
              cd -
            fi
          done

      - name: Generate checksums
        run: |
          for dir in skills/*/; do
            if [ -f "$dir/manifest.json" ]; then
              tar -czf "/tmp/$(basename $dir).tar.gz" -C skills "$(basename $dir)"
              sha256sum "/tmp/$(basename $dir).tar.gz" >> checksums.txt
            fi
          done
          cat checksums.txt

      - name: Update index.json
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node scripts/update-registry-index.js
