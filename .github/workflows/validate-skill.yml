name: Validate Skill

on:
  push:
    branches: [main]
    paths:
      - "packages/skills/**"
  pull_request:
    branches: [main]
    paths:
      - "packages/skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4

      - run: pnpm install --frozen-lockfile

      - name: Validate manifest schema
        run: |
          for dir in packages/skills/src/*/; do
            if [ -f "$dir/manifest.json" ]; then
              node -e "
                const fs = require('fs');
                const raw = fs.readFileSync('${dir}manifest.json', 'utf-8');
                const manifest = JSON.parse(raw);
                const required = ['id', 'name', 'version', 'description', 'author'];
                for (const key of required) {
                  if (!manifest[key]) {
                    console.error('Missing field: ' + key + ' in ${dir}manifest.json');
                    process.exit(1);
                  }
                }
                console.log('Valid: ${dir}manifest.json');
              "
            fi
          done

      - name: Security scan
        run: |
          for dir in packages/skills/src/*/; do
            if [ -f "$dir/manifest.json" ]; then
              echo "=== Security scan: $dir ==="
              manifest="$dir/manifest.json"

              has_shell=$(node -e "const m=JSON.parse(require('fs').readFileSync('$manifest','utf-8'));console.log(m.capabilities?.shell===true)")
              has_fs=$(node -e "const m=JSON.parse(require('fs').readFileSync('$manifest','utf-8'));console.log(m.capabilities?.filesystem?.enabled===true)")

              for f in $(find "$dir" -name '*.ts' -o -name '*.js' | grep -v node_modules); do
                if grep -qE '\beval\s*\(' "$f"; then
                  echo "CRITICAL: eval() found in $f"
                  exit 1
                fi
                if grep -qE '\bnew\s+Function\s*\(' "$f"; then
                  echo "CRITICAL: new Function() found in $f"
                  exit 1
                fi
                if grep -qE "from\s+['\"]node:child_process['\"]|require\s*\(\s*['\"]child_process['\"]\s*\)" "$f"; then
                  if [ "$has_shell" != "true" ]; then
                    echo "ERROR: $f uses child_process without shell capability"
                    exit 1
                  fi
                fi
                if grep -qE "from\s+['\"]node:fs['\"]|from\s+['\"]fs['\"]|from\s+['\"]node:fs/promises['\"]" "$f"; then
                  if [ "$has_fs" != "true" ] && [ "$has_shell" != "true" ]; then
                    fs_ops=$(grep -cE "\b(writeFile|mkdir|unlink|readdir|statSync|lstat|access|appendFile|copyFile|rename|rmdir)\b" "$f" || true)
                    non_manifest_reads=$(grep -v "^import " "$f" | grep -E "readFile" | grep -cv "manifest\.json" || true)
                    if [ "$fs_ops" -gt 0 ] || [ "$non_manifest_reads" -gt 0 ]; then
                      echo "ERROR: $f uses fs without filesystem or shell capability"
                      exit 1
                    fi
                  fi
                fi
              done

              echo "PASS: $dir"
            fi
          done

      - name: Build skills
        run: pnpm --filter @openmotoko/skills build

      - name: Test skills
        run: |
          cd packages/skills
          if grep -q '"test"' package.json; then
            pnpm test
          fi
