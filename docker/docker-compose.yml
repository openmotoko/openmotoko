services:
  openmotoko:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: openmotoko
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    networks:
      - openmotoko-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3457/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    container_name: openmotoko-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    networks:
      - openmotoko-net
    depends_on:
      openmotoko:
        condition: service_healthy

networks:
  openmotoko-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
