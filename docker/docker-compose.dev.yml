services:
  openmotoko:
    image: node:24-alpine
    container_name: openmotoko-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install && pnpm dev"
    ports:
      - "3457:3457"
      - "5173:5173"
    volumes:
      - ..:/app
      - dev_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development

volumes:
  dev_node_modules:
