name = "openmotoko-registry"
main = "src/index.ts"
compatibility_date = "2026-02-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "openmotoko-registry"
database_id = "placeholder"

[[r2_buckets]]
binding = "PACKAGES"
bucket_name = "openmotoko-skill-packages"

[vars]
CORS_ORIGIN = "https://openmotoko.ai"
